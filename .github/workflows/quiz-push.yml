name: 생일 가챠 퀴즈 알림

# 한국 시간 0,2,4,…,22시 = UTC 홀수 시(15,17,…,13)
# GitHub 예약은 몇 분씩 늦거나 가끔 빠져서 구간마다 정각·15분 두 번 부른다.
# 서버는 같은 구간에 사람마다 한 번만 보내므로 두 번 불려도 중복 알림은 없다.
on:
  schedule:
    - cron: "0,15 1-23/2 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 퀴즈 알림 보내기
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://woojung-event-lgam.vercel.app
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/birthday-gacha/push/quiz"
